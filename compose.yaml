services:
    price-watch:
        image: ghcr.io/kimata/price-watch:latest@sha256:7722c30d714e9c9c43e032b00faa3c631b0ddd9db7ba924b7b43d296c1da300e
        tty: false
        stdin_open: true
        volumes:
            - ./config.yaml:/opt/price-watch/config.yaml:ro
