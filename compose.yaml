services:
    price-watch:
        image: ghcr.io/kimata/price-watch:latest@sha256:f846cc39f71cbd4bd316e96d8a0dcc6d7dc864d37417cf8ba61573e127902b77
        tty: false
        stdin_open: true
        volumes:
            - ./config.yaml:/opt/price-watch/config.yaml:ro
            - ./target.yaml:/opt/price-watch/target.yaml:ro
            - ./data:/opt/price-watch/data
        ports:
            - "5000:5000"
